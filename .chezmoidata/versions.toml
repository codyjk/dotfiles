# Pinned so `chezmoi apply` is repeatable. Bump a version to re-download.
# All assets are macOS arm64 builds.
# When you bump a version, update its hash in [checksums] in the same commit.
[versions]
nvim = "v0.10.4"      # config pins nvim-treesitter v0.9.2; stay on 0.10.x
ripgrep = "15.2.0"
fd = "v10.5.0"
fzf = "0.74.4"
gh = "2.102.0"
fnm = "v1.39.0"
uv = "0.12.21"
python = "3.13.15"
node = "24.21.0"
pyright = "1.1.414"
typescript = "5.9.3"  # typescript-tools.nvim needs tsserver.js; TypeScript 7 (Go) has none
rustup = "1.29.1"
rust = "1.98.1"
tmux = "3.7c"
libevent = "2.1.13-stable"
utf8proc = "2.12.0"
ghostty = "1.3.1"
vale = "3.24.0"
ghostty_team_id = "24VZTF6M5V"  # Apple Developer Team ID that signs Ghostty.app
powerlevel10k = "d05a1b00f9a61f9578bf9dc19b8451942dde8734"  # a commit; the last tag (v1.20.0) is older
homebrew = "7.0.9"

