# Use terminal colors
# https://github.com/tmux/tmux/issues/1246
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# pass focus changes to Neovim (its auto light/dark check runs on focus)
set -g focus-events on

# increase scrollback buffer size
set -g history-limit 50000

# vim key bindings in tmux command prompt
set -g status-keys vi

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.config/tmux/tmux.conf

# vim keybindings while in copy mode
setw -g mode-keys vi

# dedicated prefix for sending commands to nested tmux
bind-key -n C-o send-prefix

# Bootstrap TPM
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# theme: ANSI colors only, so tmux follows the Ghostty palette (see `theme`)
set -g status-style "bg=default,fg=brightblack"
set -g status-left "#S  "
set -g status-left-length 30
set -g status-right "%a %H:%M"
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W"
set -g window-status-current-style "fg=default,bold"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=white"
set -g message-style "bg=default,fg=default"
set -g mode-style "reverse"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
